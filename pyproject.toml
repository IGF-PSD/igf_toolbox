[tool.poetry]
name = "igf-toolbox"
version = "0.1.0"
description = "Toolbox containing utilities for loading and preprocessing data and econometric modeling"
authors = ["Pôle Science des données de l'IGF <igf.science-donnees@igf.finances.gouv.fr>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.2.4"
pandas = "^2.2.3"
numba = "^0.61.0"
urllib3 = "^2.3.0"
geopandas = "^1.0.1"
matplotlib = "^3.10.1"
openpyxl = "^3.1.5"
scikit-learn = "^1.6.1"
statsmodels = "^0.14.4"
linearmodels = "^6.1"
xlsxwriter = "^3.2.2"
boto3 = "^1.34.34"
s3fs = "^2024.2.0"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
pytest = "^8.3.5"
moto = {extras = ["s3"], version = "^5.1.1"}


[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.9"
mkdocstrings-python = "^1.16.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
